        const englishWordEl = document.getElementById('english-word');
        const chineseTranslationEl = document.getElementById('chinese-translation');
        const listenBtn = document.getElementById('listen-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressTextEl = document.getElementById('progress-text');

        let availableWords = [...ALL_WORDS]; 
        let currentWord = null;
        let wordsCompleted = 0;
        let enVoice = null;
        let cnVoice = null;

        function setVoices() {
            const voices = window.speechSynthesis.getVoices();
            
            // 英文音色首选列表
            const preferredEnVoices = ['Laura', 'Ruby', 'Moli'];
            
            // 尝试在系统中寻找首选英文音色
            enVoice = voices.find(v => v.lang.startsWith('en-') && preferredEnVoices.some(name => v.name.includes(name)));
            
            // 如果没找到首选音色，回退到任何英文音色
   //         if (!enVoice) {
   //             enVoice = voices.find(v => v.lang.startsWith('en-'));
   //         }
            
            cnVoice = voices.find(v => v.lang.startsWith('zh-'));
        }
        
        if ('speechSynthesis' in window) {
            setVoices(); 
            window.speechSynthesis.onvoiceschanged = setVoices;
        }

        function getAndDisplayNewWord(autoSpeak = true) {
            if (availableWords.length === 0) {
                englishWordEl.textContent = "恭喜您！";
                chineseTranslationEl.textContent = "您已完成所有300个单词的学习。";
                listenBtn.disabled = true;
                nextBtn.disabled = true;
                nextBtn.textContent = "已完成";
                return;
            }

            const randomIndex = Math.floor(Math.random() * availableWords.length);
            currentWord = availableWords.splice(randomIndex, 1)[0]; 
            wordsCompleted = ALL_WORDS.length - availableWords.length;

            englishWordEl.textContent = currentWord.en;
            chineseTranslationEl.textContent = currentWord.cn;
            progressTextEl.textContent = `进度: ${wordsCompleted}/${ALL_WORDS.length}`;
            
            if (autoSpeak) speakCurrentWord();
        }

        function speakCurrentWord() {
            if (!currentWord || !('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); 
            
            const enUtterance = new SpeechSynthesisUtterance(currentWord.en);
            enUtterance.lang = 'en-US'; 
            enUtterance.rate = 0.8; 
            if (enVoice) enUtterance.voice = enVoice;

            const cnUtterance = new SpeechSynthesisUtterance(currentWord.cn);
            cnUtterance.lang = 'zh-CN'; 
            cnUtterance.rate = 0.8;
            if (cnVoice) cnUtterance.voice = cnVoice;
            
            enUtterance.onend = () => window.speechSynthesis.speak(cnUtterance);
            window.speechSynthesis.speak(enUtterance);
        }

        // ----------------------------------------------------------------------
        // 4. 事件监听器
        // ----------------------------------------------------------------------
        listenBtn.addEventListener('click', speakCurrentWord);
        nextBtn.addEventListener('click', () => getAndDisplayNewWord(true)); 

        window.onload = function() {
            if ('speechSynthesis' in window) {
                getAndDisplayNewWord(false);
            } else {
                englishWordEl.textContent = "抱歉！";
                chineseTranslationEl.textContent = "您的浏览器不支持语音功能。";
                listenBtn.disabled = true;
                nextBtn.disabled = true;
            }
        };
    </script>
</body>
</html>
